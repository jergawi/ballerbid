<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-G+oeNzOGD3XoUb9T4s2Xr4vSTYjnDxXMZD9Kc3zS/io=' 'sha256-p35vdH9YAB8BBw9bg3ivZuc6ATb9+GqGYeZyYloiJiM=' https://cdn.jsdelivr.net/npm/mqtt@5.16.1/dist/mqtt.min.js; worker-src blob:; connect-src wss://broker.emqx.io:8084 wss://broker.hivemq.com:8884; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e4e9f3">
<title>BALLER BID 球星喊價</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--ink:#1c2333;--panel:#fff;--panel2:#f4f6fa;--soft:#e2e6ee;--line:#d9dee8;--text:#1c2333;--acc:#ff7a1a;--yel:#ffc93c;--a:#2f7cf6;--b:#ef4565;--ok:#1fae5b;--gold:#e8a400;
  --disp:'Barlow Condensed','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;--num:'Barlow Condensed','Noto Sans TC',sans-serif;--ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.3,1.35,.5,1);
  --sh:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-size:15px;line-height:1.5;font-weight:500}
body{min-height:100vh;color:var(--ink);--mut:#687089;background:linear-gradient(180deg,#e4e9f3 0,var(--bg) 320px)}
.wrap{max-width:600px;margin:0 auto;padding:12px 12px 64px}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;transition:transform .12s var(--ease),box-shadow .2s,opacity .2s,background-color .2s,border-color .2s}
button:not(:disabled):active{transform:scale(.97)}
button:disabled{opacity:.38;cursor:not-allowed}
input,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s,background-color .2s}
input:focus,textarea:focus{border-color:var(--a);background:#fff;box-shadow:0 0 0 3px rgba(47,124,246,.15)}
textarea{min-height:130px;resize:vertical;font-size:14px}
h2{font-size:13px;letter-spacing:.06em;color:var(--mut);margin:0 0 10px;font-weight:700}
h3{font-size:12.5px;letter-spacing:.08em;color:var(--acc);margin:16px 0 8px;font-weight:900}
.mut{color:var(--mut)}.small{font-size:12.5px}
.num{font-family:var(--num);font-weight:700;letter-spacing:.01em}
.card{background:var(--panel);border:1px solid var(--soft);border-radius:18px;padding:14px;margin-top:12px;box-shadow:var(--sh)}
.row{display:flex;gap:8px;align-items:center}.wrapx{flex-wrap:wrap}.grow{flex:1;min-width:0}
.chip{padding:8px 14px;border-radius:999px;background:var(--panel2);border:1.5px solid var(--line);font-weight:700;font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hero{text-align:center;padding:22px 6px 8px}
.hero h1{font-family:var(--disp);font-style:italic;font-weight:800;font-size:56px;letter-spacing:.01em;margin:0;line-height:.9;color:var(--ink);text-transform:uppercase}
.hero h1 br{display:none}
.hero h1 b{color:var(--acc);font-weight:800;margin-left:.18em}
.hero .sub{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;letter-spacing:.3em;padding:4px 10px 4px 14px;border-radius:8px}
.hero p{color:var(--mut);margin:12px auto 0;max-width:430px;font-size:14px}
.logo{font-size:40px;display:inline-block;animation:bounce 2.2s var(--ease) infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}55%{transform:translateY(0) scaleY(.94)}}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme{text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:14px;padding:9px 10px;min-height:66px;display:flex;flex-direction:column;justify-content:space-between}
.theme.on{background:#fff4ea;border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,122,26,.15)}
.theme .t1{font-weight:700;font-size:13.5px;line-height:1.35}.theme .t2{font-size:11.5px;color:var(--mut);margin-top:3px;font-weight:500}
.theme.special{border-style:dashed;background:#fff}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:11px;background:var(--panel2);border:1.5px solid var(--line);font-size:20px;font-weight:700}
.stepper .v{font-family:var(--num);font-weight:700;font-size:32px;min-width:40px;text-align:center}
.big{width:100%;padding:15px;border-radius:14px;background:var(--acc);color:#fff;font-weight:900;font-size:17px;letter-spacing:.03em;margin-top:16px;box-shadow:0 6px 16px -6px rgba(255,122,26,.7)}
.ghost{width:100%;padding:12px;border-radius:13px;background:#fff;border:1.5px solid var(--line);font-weight:700;margin-top:10px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--soft);margin-top:10px;box-shadow:var(--sh)}
.mode .ic{font-size:26px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--panel2);flex:none}
.mode b{display:block;font-size:16px;font-weight:900}.mode span{font-size:12.5px;color:var(--mut)}
.mode.hot{border-color:rgba(255,122,26,.45)}.mode.hot .ic{background:#fff0e3}
.err{background:#fdecef;border:1px solid #f6b9c6;color:#b3173b;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px;animation:fadein .3s}
.note{background:#fff;border:1px solid var(--soft);border-left:4px solid var(--acc);padding:9px 11px;border-radius:12px;font-size:13px;margin-top:12px;color:var(--mut)}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] > :not(summary){animation:fadein .3s}
details ol,details ul{padding-left:20px;margin:10px 0 0;color:#3d4458;font-size:14px}details li{margin-bottom:6px}
.score{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}.score:last-child{border:0}
.roombar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--soft);border-radius:14px;padding:8px 12px;font-size:13px;box-shadow:var(--sh)}
.roombar .code{font-family:var(--num);font-weight:700;font-size:22px;letter-spacing:.14em;color:var(--acc)}
.invite{text-align:center}
.invite .code{font-family:var(--num);font-weight:700;font-size:56px;letter-spacing:.2em;color:var(--acc);line-height:1}
.seats{display:grid;gap:8px}
.seat{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:var(--panel2);border:1.5px solid var(--line);transition:border-color .25s,background-color .25s}
.seat.me{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,#fff)}
.seat .lab{width:64px;font-weight:900;color:var(--c);font-size:13px}
.seat .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;animation:fadein .3s}
.seat button{padding:7px 12px;border-radius:999px;background:var(--c);color:#fff;font-weight:700;font-size:13px}
.H{--c:var(--acc)}.A{--c:var(--a)}.B{--c:var(--b)}
.screen{animation:screenIn .38s var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.5);opacity:0}65%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes slotIn{0%{opacity:0;transform:translateX(-6px);background:#fff0e3}100%{opacity:1;transform:none;background:transparent}}
/* auction */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.prog{font-size:13px;color:var(--mut)}.prog b{font-family:var(--num);font-weight:700;font-size:24px;color:var(--ink);margin:0 2px}
.peek{padding:7px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700}
.bar{height:6px;background:var(--soft);border-radius:6px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .5s var(--ease)}
.stage{perspective:900px;margin-top:12px}
.pcard{border-radius:20px;min-height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;width:100%}
.pcard.back{background:repeating-linear-gradient(135deg,#ff7a1a 0 18px,#f26c0c 18px 36px);color:#fff;box-shadow:0 8px 20px -8px rgba(242,108,12,.6);animation:dealIn .45s var(--ease)}
@keyframes dealIn{from{opacity:0;transform:translateX(50px) rotate(4deg)}to{opacity:1;transform:none}}
.pcard.back .q{font-family:var(--num);font-weight:800;font-style:italic;font-size:66px;line-height:1}.pcard.back .h{font-weight:700;margin-top:4px;opacity:.95}
.pcard.back.can{animation:dealIn .45s var(--ease),glow 2s ease-in-out .5s infinite}
@keyframes glow{0%,100%{box-shadow:0 8px 20px -8px rgba(242,108,12,.6)}50%{box-shadow:0 8px 28px -4px rgba(242,108,12,.8)}}
.pcard.wait{background:#fff;border:2px dashed var(--line);color:var(--mut);animation:dealIn .45s var(--ease)}
.pcard.front{background:#fff;border:1px solid var(--soft);box-shadow:var(--sh);border-top:5px solid var(--acc);animation:flip .55s var(--ease);transform-origin:center}
@keyframes flip{0%{transform:rotateY(-90deg) scale(.96);opacity:.3}100%{transform:none;opacity:1}}
.pname{font-family:var(--disp);font-weight:800;font-size:46px;line-height:1;letter-spacing:.01em}
.psub{color:var(--mut);margin-top:8px;font-size:13.5px}
.poss{display:flex;gap:5px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.poss span{padding:2px 9px;border-radius:7px;font-family:var(--num);font-weight:700;font-size:15px;letter-spacing:.04em;background:var(--panel2);color:#a3a9ba}
.poss span.n{background:var(--ok);color:#fff}.poss span.c{background:#e3edff;color:#2457b8}
.pstats{display:flex;gap:16px;margin-top:10px;justify-content:center}.pstats div{text-align:center}.pstats b{font-family:var(--num);font-weight:700;font-size:24px;display:block;line-height:1}.pstats i{font-style:normal;font-size:11px;color:var(--mut)}
.cur{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px;border-radius:16px;background:#fff;border:1.5px solid var(--soft);min-height:70px;box-shadow:var(--sh);transition:border-color .3s}
.cur .amt{font-family:var(--num);font-weight:800;font-size:50px;line-height:1;animation:pop .35s var(--pop)}.cur .who{font-weight:700;animation:fadein .3s}
.bidders{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bidder{background:#fff;border:1.5px solid var(--soft);border-radius:18px;padding:0 0 10px;overflow:hidden;box-shadow:var(--sh);transition:transform .3s var(--ease),box-shadow .3s,border-color .3s,opacity .3s}
.bidder>*:not(.bn){margin-left:10px;margin-right:10px}
.bidder.lead{border-color:var(--c);transform:translateY(-3px);box-shadow:0 10px 24px -10px color-mix(in srgb,var(--c) 60%,transparent)}
.bidder.full{opacity:.6}
.bn{font-weight:900;color:#fff;background:var(--c);font-size:14.5px;padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money{font-family:var(--num);font-weight:700;font-size:40px;line-height:1;margin-top:6px}.money small{font-size:22px;color:var(--mut)}
.mini{display:grid;gap:3px;margin:8px 0}
.mini div{display:flex;gap:6px;font-size:12px;align-items:center;min-width:0}
.mini span{flex:none;width:26px;font-family:var(--num);font-weight:700;color:#a3a9ba;font-size:13px}
.mini em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;animation:slotIn .6s var(--ease);font-weight:700}.mini em.empty{color:#cdd2dd;animation:none}
.bbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bb{padding:9px 4px;border-radius:11px;background:var(--c);color:#fff;font-family:var(--num);font-weight:700;font-size:19px;line-height:1.05}
.bb small{display:block;font-family:'Noto Sans TC',sans-serif;font-weight:500;font-size:11px;opacity:.9;margin-top:2px}
.bb.all{grid-column:1/-1;background:#fff;color:var(--c);border:1.5px solid var(--c)}
.acts{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-top:14px}
.acts button{padding:13px 6px;border-radius:14px;font-weight:900;background:#fff;border:1.5px solid var(--line)}
.acts .sold{background:var(--ok);color:#fff;border-color:var(--ok);font-size:16px;box-shadow:0 6px 16px -8px rgba(31,174,91,.8)}
.hint{font-size:12.5px;color:#3d4458;text-align:center;margin-top:10px;animation:fadein .3s}
.quit{display:block;margin:22px auto 0;font-size:12.5px;color:var(--mut);text-decoration:underline}
.sheet{position:fixed;inset:0;background:rgba(20,26,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fadein .2s}
.sheet .in{background:#fff;border-radius:22px 22px 0 0;padding:18px 16px 26px;width:100%;max-width:600px;animation:up .34s var(--ease);box-shadow:0 -10px 30px rgba(20,30,60,.15)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:14px}
.slots button{padding:12px 6px;border-radius:13px;background:var(--panel2);border:1.5px solid var(--line);font-family:var(--num);font-weight:700;font-size:22px}
.slots button small{display:block;font-family:'Noto Sans TC',sans-serif;font-size:11.5px;font-weight:700;margin-top:2px}
.slots .t0{border-color:var(--ok);background:#eaf8f0}.slots .t0 small{color:#13874a}
.slots .t1{border-color:#8fb4f5;background:#eef4ff}.slots .t1 small{color:#2457b8}
.slots .t2 small{color:#c06a00}.slots .t3 small{color:#c4173f}
.center{text-align:center}.lock{font-size:56px;margin-top:24px}
/* results */
.rs{opacity:0;animation:rise .55s var(--ease) forwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.simov{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);pointer-events:none;animation:ovOut .5s ease 1.4s forwards}
.simov .ball{font-size:60px;animation:bounce .7s var(--ease) infinite}.simov div{font-weight:900;margin-top:10px;letter-spacing:.1em;color:var(--mut)}
@keyframes ovOut{to{opacity:0;visibility:hidden}}
.reveal{text-align:center;padding:18px 14px;border-radius:18px;background:#fff;border:1px solid var(--soft);border-top:5px solid var(--acc);box-shadow:var(--sh);margin-top:12px}
.reveal .lab{font-size:12px;letter-spacing:.2em;color:var(--acc);font-weight:900}
.reveal .tn{font-size:26px;font-weight:900;margin-top:4px;line-height:1.25}.reveal .tt{color:var(--mut);margin-top:4px;font-size:13px}
.board{margin-top:12px;border-radius:18px;padding:16px 12px;background:#1c2333;text-align:center;color:#fff;--mut:#9aa3bd;box-shadow:var(--sh)}
.board .lab{font-size:12px;letter-spacing:.2em;color:#9aa3bd;font-weight:900}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:6px}
.scoreline .nm{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scoreline .sc{font-family:var(--num);font-weight:800;font-size:72px;line-height:1;transition:color .4s}
.scoreline .dash{font-family:var(--num);font-size:40px;color:var(--acc)}
.wp{display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:12px;background:rgba(255,255,255,.12)}
.wp i{display:block;height:100%;transform-origin:left;animation:grow 1.1s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.facts div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px}.facts b{display:block;font-family:var(--num);font-weight:700;font-size:28px;line-height:1.1}.facts span{font-size:11.5px;color:var(--mut)}
.win{text-align:center;font-size:21px;font-weight:900;margin-top:10px}
.teamhead{display:flex;align-items:center;gap:10px;margin-top:20px;padding-left:10px;border-left:5px solid var(--c)}
.teamhead .nm{font-weight:900;font-size:18px;color:var(--c)}
.grade{font-family:var(--num);font-weight:800;font-size:34px;line-height:1;color:var(--gold)}
.grade small{font-family:'Noto Sans TC',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--mut);margin-left:4px}
.srow{display:grid;grid-template-columns:48px 1fr;margin-top:8px;border-radius:14px;overflow:hidden;border:1px solid var(--soft);background:#fff;box-shadow:var(--sh)}
.srow .sl{display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:800;font-size:22px;background:var(--c);color:#fff}
.srow .bd{padding:8px 10px;min-width:0}
.srow .nm{font-family:var(--disp);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:19px;line-height:1.15}
.srow .sb{font-size:12px;color:var(--mut)}
.srow .st{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:4px}
.st div{text-align:center}.st b{display:block;font-family:var(--num);font-weight:700;font-size:18px}.st i{font-style:normal;font-size:10px;color:var(--mut)}
.srow .pr{float:right;font-family:var(--num);font-weight:700;font-size:19px;color:var(--c);margin-left:6px}
.tag{font-style:normal;font-size:11px;padding:1px 6px;border-radius:5px;margin-left:4px;font-weight:700}
.tag.t1{background:#e3edff;color:#2457b8}.tag.t2{background:#fff0dc;color:#c06a00}.tag.t3{background:#fde3ea;color:#c4173f}
.tot{display:grid;grid-template-columns:repeat(5,1fr);margin-top:8px;padding:10px 4px;border-radius:14px;background:var(--panel2);border:1px solid var(--soft);text-align:center}
.tot b{display:block;font-family:var(--num);font-weight:700;font-size:20px}.tot i{font-style:normal;font-size:10.5px;color:var(--mut)}
table.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th,.cmp td{padding:7px 4px;border-bottom:1px dashed var(--line);text-align:center}
.cmp td:first-child,.cmp th:first-child{text-align:left}
.cmp .w{font-weight:900;color:#13874a}
.cmp small{display:block;font-size:11px;color:var(--mut);font-weight:500}
table.box{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.box th,.box td{padding:5px 3px;text-align:right;border-bottom:1px solid var(--soft)}.box th:first-child,.box td:first-child{text-align:left}
.box th{color:var(--mut);font-weight:700}
.log{font-size:13px;margin-top:8px}.log div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-140px);background:var(--ink);color:#fff;font-weight:700;padding:11px 18px;border-radius:14px;z-index:50;transition:transform .35s var(--ease);max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(20,30,60,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .9s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.chemh{margin-top:10px;font-size:13px;font-weight:700;text-align:center;animation:fadein .4s}
.chemh div{display:inline-block;margin:3px;background:#fff;border:1px solid var(--soft);border-radius:999px;padding:3px 12px;box-shadow:var(--sh)}
.chemt{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.chemt:last-of-type{border:0}.chemt>div{margin-top:4px}.chemt a{color:var(--a)}
.mis{padding:8px 0;border-bottom:1px dashed var(--line)}.mis:last-child{border:0}
.up{color:#13874a;font-style:normal;font-weight:900}.dn{color:#d0103a;font-style:normal;font-weight:900}
.box i{font-size:9px;margin-left:1px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.rs{opacity:1}}
:root{--c3:#8b5cf6}
.C{--c:var(--c3)}
.brow{background:#fff;border:1.5px solid var(--soft);border-radius:16px;margin-top:10px;overflow:hidden;box-shadow:var(--sh);transition:border-color .3s,box-shadow .3s,transform .3s var(--ease),opacity .3s}
.brow.lead{border-color:var(--c);transform:translateY(-2px);box-shadow:0 10px 24px -12px color-mix(in srgb,var(--c) 70%,transparent)}
.brow.out{opacity:.55}
.brow .hd{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--c);color:#fff}
.brow .hd .nm{font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .hd .mo{font-family:var(--num);font-weight:800;font-size:22px;line-height:1}
.brow .hd .mx{font-size:11.5px;opacity:.9}
.brow .bd{padding:8px 10px}
.rost{display:flex;gap:4px;flex-wrap:wrap}
.rost span{font-size:11.5px;padding:2px 7px;border-radius:7px;background:var(--panel2);color:#a3a9ba;border:1px solid var(--soft);white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis}
.rost span b{font-family:var(--num);margin-right:3px}
.rost span.f{background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--ink);border-color:color-mix(in srgb,var(--c) 35%,#fff);animation:slotIn .6s var(--ease)}
.bbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.bb.all{grid-column:auto;background:#fff;color:var(--c);border:1.5px solid var(--c)}
.bb.pass{background:var(--panel2);color:var(--mut);font-family:'Noto Sans TC',sans-serif;font-size:13px;font-weight:700;border:1.5px solid var(--line)}
.state{font-size:12px;color:var(--mut);margin-left:auto}
.cd{height:5px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px;width:100%}
.cd i{display:block;height:100%;background:var(--acc);transition:width .2s linear}
.cur{flex-direction:column;gap:2px}
.cur .line{display:flex;align-items:center;gap:12px}
.champ{margin-top:12px;text-align:center;padding:16px;border-radius:18px;background:linear-gradient(135deg,#fff7e8,#fff);border:1.5px solid #ffd7a8;box-shadow:var(--sh)}
.champ .t{font-size:13px;letter-spacing:.2em;color:var(--acc);font-weight:900}
.champ .w{font-size:26px;font-weight:900;margin-top:2px}
.series{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}.series:last-child{border:0}
.series .sc{font-family:var(--num);font-weight:800;font-size:26px;min-width:64px;text-align:center}
.gms{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.gms span{font-family:var(--num);font-size:13px;padding:1px 6px;border-radius:6px;background:var(--panel2)}
table.std{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
.std th,.std td{padding:6px 4px;text-align:center;border-bottom:1px dashed var(--line)}.std th:first-child,.std td:first-child{text-align:left}
.std th{color:var(--mut);font-size:12px;font-weight:700}
.pct{font-size:12px;color:var(--mut);margin-left:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}

.intro{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:10px}
.intro span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#fff4ea;color:#b45309;border:1px solid #ffd7a8}
.link{font-size:12px;color:var(--a);text-decoration:underline;margin-top:6px;font-weight:700}
/* typed bid */
.bidin{display:grid;grid-template-columns:42px 1fr 42px 1.25fr;gap:6px;margin-top:8px;align-items:stretch}
.bidin .stp{border-radius:11px;background:var(--panel2);border:1.5px solid var(--line);font-size:22px;font-weight:700;color:var(--ink,#1d2233)}
.bidin .amt{width:100%;min-width:0;text-align:center;font-family:var(--num);font-weight:700;font-size:24px;border-radius:11px;border:1.5px solid var(--c);background:#fff;padding:6px 4px;-moz-appearance:textfield}
.bidin .amt::-webkit-outer-spin-button,.bidin .amt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bidin .amt:disabled{border-color:var(--line);color:var(--mut);background:var(--panel2)}
.bidin .bb.go{font-family:'Noto Sans TC',sans-serif;font-size:15px}
.bidin .bb.go small{font-family:var(--num);font-size:15px}
.brow .bbtns{grid-template-columns:1fr 1fr;margin-top:6px}
.brow .bbtns .bb{font-size:14px;font-family:'Noto Sans TC',sans-serif;padding:9px 4px}
.brow.turn{box-shadow:0 0 0 2px var(--c) inset}
.bb:disabled,.stp:disabled{opacity:.4}

function grade(pct){return pct>=90?'S':pct>=70?'A':pct>=40?'B':pct>=15?'C':'D'}

async function deriveRoom(code){
  const sub=crypto&&crypto.subtle;

  const h=new Uint8Array(await sub.digest('SHA-256',enc.encode('bb-topic:'+code)));NET.tid=[...h.slice(0,10)].map(x=>x.toString(16).padStart(2,'0')).join('');

  if(g){if(!Array.isArray(g.sides)||!g.sides.length||!g.sides.every(x=>ALL.includes(x)))return false;if(!/^[a-z0-9]{1,12}$/.test(String(g.gid)))return false;

  if(k==='myname'){MYNAME=clean(t.value);lsSet('bb_name',MYNAME)}
  if(k==='name'){const s=t.dataset.i;S.names[s]=t.value;debounced('names',()=>dispatch({a:'names',[s]:S.names[s]}))}
  if(k==='cname'||k==='ctext'){const c=S.cfg.custom;const nc={name:k==='cname'?t.value:c.name,text:k==='ctext'?t.value:c.text};S.cfg.custom=nc;debounced('custom',()=>dispatch({a:'cfg',cfg:{custom:nc}}),700)}
  if(k==='amt'){const v=parseInt(t.value,10);ui.amt[t.dataset.who]=isNaN(v)?0:v;const go=document.querySelector(`[data-act="bidv"][data-who="${t.dataset.who}"] small`);if(go)go.textContent='$'+(isNaN(v)?'':v);return}
  if(k==='budget'){const v=parseInt(t.value,10);if(v>=5)debounced('budget',()=>dispatch({a:'cfg',cfg:{budget:v}}),700)}
});
function bidTyped(who){const g=S.game;if(!g)return;const el=document.querySelector(`[data-in="amt"][data-who="${who}"]`);const v=el?parseInt(el.value,10):amtFor(g,who),mx=maxBid(g,who);
  if(isNaN(v)||v<=g.bid.amt)return toast(`至少要出 $${g.bid.amt+1}`);if(v>mx)return toast(`你最多只能出 $${mx}（要留錢補滿陣容）`);
  if(el)el.blur();ui.amt={};return dispatch({a:'bid',who,amt:v,idx:g.idx})}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target.dataset)return;if(e.target.dataset.in==='code')joinRoom(e.target.value);if(e.target.dataset.in==='amt')bidTyped(e.target.dataset.who)});
window.addEventListener('hashchange',()=>{if(!NET.mode)render()});

(async()=>{try{await loadData()}catch(e){document.getElementById('app').innerHTML='<div class="err">球員資料載入失敗，請重新整理。</div>';return}render()})();

</script>
</body>
</html>
